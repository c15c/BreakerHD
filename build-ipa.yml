name: Build and publish AltStore IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore app icon
        run: base64 --decode AppIcon.base64 > BoredomBreaker/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
      - name: Build iPhone app
        run: |
          xcodebuild \
            -project BoredomBreaker.xcodeproj \
            -scheme BoredomBreaker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BreakerHD.app Payload/
          zip -qry BreakerHD.ipa Payload
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BreakerHD-ipa
          path: BreakerHD.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Publish AltStore release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ICON="BoredomBreaker/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 BreakerHD.ipa "$ICON" --clobber
          else
            gh release create v0.1.0 BreakerHD.ipa "$ICON" \
              --title "Breaker HD 0.1.0" \
              --notes "First AltStore-ready build of Breaker HD."
          fi
